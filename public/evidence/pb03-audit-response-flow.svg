ification</text><text x="1003" y="528" class="small" text-anchor="middle">No forced isolation</text><path d="M 372 360 L 423 360" class="connector"/><path d="M 775 360 L 826 360" class="connector"/><text x="600" y="620" text-anchor="middle" fill="#5d6e81" font-size="13" font-family="Arial,Helvetica,sans-serif">API dispatch acceptance is not proof that the endpoint script executed.</text><text x="32" y="661" fill="#6d7d91" font-family="Arial,Helvetica,sans-serif" font-size="12">Adapted from joint capstone diagrams · Conceptual workflow; not proof of every execution</text></svg>