f3ff" stroke="#2e68ad" stroke-width="1.8"/><text x="913.5" y="185.5" class="node" text-anchor="middle">4 · NGINX</text><text x="913.5" y="202.5" class="small" text-anchor="middle">TLS / reverse proxy</text><path d="M 1026 195 L 1054 195" class="connector"/><rect x="1062" y="126" width="219" height="137" rx="11" fill="#f4edfc" stroke="#7b54a3" stroke-width="1.8"/><text x="1171.5" y="185.5" class="node" text-anchor="middle">5 · Web VM</text><text x="1171.5" y="202.5" class="small" text-anchor="middle">Application backend</text><rect x="610" y="457" width="390" height="102" rx="11" fill="#eaf3ff" stroke="#2e68ad" stroke-width="1.8"/><text x="805" y="499" class="node" text-anchor="middle">Wazuh SIEM</text><text x="805" y="516" class="small" text-anchor="middle">Alert rules · event correlation</text><rect x="38" y="356" width="206" height="72" rx="11" fill="#fceced" stroke="#c95151" stroke-width="1.8"/><text x="141" y="383" class="node" text-anchor="middle">Blocked traffic</text><text x="141" y="400" class="small" text-anchor="middle">Suricata DROP</text><rect x="330" y="330" width="196" height="82" rx="11" fill="#e5f7f8" stroke="#148394" stroke-width="1.8"/><text x="428" y="362" class="node" text-anchor="middle">eve.json</text><text x="428" y="379" class="small" text-anchor="middle">Network alert events</text><rect x="574" y="330" width="196" height="82" rx="11" fill="#e5f7f8" stroke="#148394" stroke-width="1.8"/><text x="672" y="362" class="node" text-anchor="middle">access.log</text><text x="672" y="379" class="small" text-anchor="middle">NGINX access / errors</text><rect x="818" y="330" width="196" height="82" rx="11" fill="#e5f7f8" stroke="#148394" stroke-width="1.8"/><text x="916" y="362" class="node" text-anchor="middle">Application logs</text><text x="916" y="379" class="small" text-anchor="middle">Host and service events</text><path d="M 650 263 V 295 H 142 V 355" class="connector"/><path d="M 652 263 L 652 329" class="dashed"/><path d="M 916 263 L 916 329" clas